name: Open Finance isolated tests
on: [pull_request]
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash tests/run_postgres.sh
      - run: node --test tests/open-finance-ui.test.cjs
